<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写真加工シマスマ</title>

<style>
@font-face {
  font-family: 'CustomFont';
  src: url('wapuro-mincho.otf') format('opentype');
}

body {
  background: #BCBCBC;
  color: #000000;
  text-align: center;
  font-family: 'CustomFont', sans-serif;
  margin: 0;
  padding: 15px;
}

h2 {
  font-size: 22px;
  margin-bottom: 5px;
}

.description {
  font-size: 14px;
  margin-bottom: 15px;
}

canvas {
  margin-top: 15px;
  width: 100%;
  height: auto;
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 6px;
  background: #009700;
  color: #ffffff;
  font-family: 'CustomFont', sans-serif;
  font-size: 16px;
  cursor: pointer;
  margin-top: 10px;
}

#fileName {
  margin-top: 8px;
  font-size: 14px;
}

.controls {
  margin-top: 15px;
}

input[type="range"] {
  width: 100%;
  margin-top: 10px;
}

@media (min-width: 768px) {
  body {
    max-width: 500px;
    margin: auto;
  }

  button {
    width: auto;
    padding: 10px 20px;
  }

  input[type="range"] {
    width: 80%;
  }
}
</style>
</head>

<body>

<h2>写真加工シマスマ</h2>
<p class="description">フィルム写真風加工をします</p>

<input type="file" id="upload" accept="image/*" hidden>
<button id="selectBtn">写真を選択</button>
<p id="fileName">未選択</p>

<div class="controls">
  強さ：
  <input type="range" id="strength" min="0" max="100" value="70">
  <span id="value">70</span>%
  <button id="save">保存（JPG）</button>
</div>

<canvas id="canvas"></canvas>

<script>
const upload = document.getElementById('upload');
const selectBtn = document.getElementById('selectBtn');
const fileName = document.getElementById('fileName');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const slider = document.getElementById('strength');
const valueText = document.getElementById('value');
const saveBtn = document.getElementById('save');

let originalImage = null;

selectBtn.addEventListener('click', () => {
  upload.click();
});

upload.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;

  fileName.textContent = file.name;

  const img = new Image();
  img.src = URL.createObjectURL(file);

  img.onload = () => {
    originalImage = img;

    const maxWidth = 1000;
    const scale = Math.min(1, maxWidth / img.width);

    canvas.width = img.width * scale;
    canvas.height = img.height * scale;

    applyFilter();
  };
});

slider.addEventListener('input', () => {
  valueText.textContent = slider.value;
  if (originalImage) applyFilter();
});

function applyFilter() {
  const strength = slider.value / 100;

  ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);

  let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  let data = imageData.data;

  for (let i = 0; i < data.length; i += 4) {
    let r = data[i];
    let g = data[i + 1];
    let b = data[i + 2];

    let newR = r * (1 + 0.2 * strength) + g * (0.1 * strength);
    let newG = g * (1 + 0.05 * strength);
    let newB = b * (1 - 0.2 * strength);

    let avg = (newR + newG + newB) / 3;
    newR = newR * (1 - 0.3 * strength) + avg * (0.3 * strength);
    newG = newG * (1 - 0.3 * strength) + avg * (0.3 * strength);
    newB = newB * (1 - 0.3 * strength) + avg * (0.3 * strength);

    let noise = (Math.random() - 0.5) * 50 * strength;
    newR += noise;
    newG += noise;
    newB += noise;

    data[i] = newR;
    data[i + 1] = newG;
    data[i + 2] = newB;
  }

  ctx.putImageData(imageData, 0, 0);

  let grad = ctx.createRadialGradient(
    canvas.width/2, canvas.height/2, canvas.width/4,
    canvas.width/2, canvas.height/2, canvas.width/1.2
  );
  grad.addColorStop(0, "rgba(0,0,0,0)");
  grad.addColorStop(1, `rgba(0,0,0,${0.6 * strength})`);

  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

saveBtn.addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = "film_photo.jpg";
  link.href = canvas.toDataURL("image/jpeg", 0.9);
  link.click();
});
</script>

</body>
</html>
